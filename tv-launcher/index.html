<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Inicio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/platform.css">
</head>
<body class="theme-grafite">
    <div id="wallpaper"></div>
    <div id="shade"></div>

    <!-- Topo: relógio à esquerda, botões e crédito da foto à direita -->
    <header>
        <div class="time">
            <div id="clock">--:--</div>
            <div id="date"></div>
        </div>
        <div class="top-right">
            <div id="topbar" class="topbar"></div>
            <div id="photo-title" class="photo-title"></div>
            <div id="photo-credit" class="photo-credit"></div>
        </div>
    </header>

    <div class="widgets">
    <!-- Tocando agora (Spotify, YouTube…) -->
    <section id="media" class="glass media hidden">
        <div id="m-cover" class="m-cover"></div>
        <div class="m-info">
            <div id="m-title" class="m-title"></div>
            <div id="m-artist" class="m-artist"></div>
            <div id="m-bar" class="m-bar"><div id="m-fill" class="m-fill"></div></div>
            <div id="m-app" class="m-app"></div>
        </div>
        <div id="m-btns" class="m-btns"></div>
    </section>

    <!-- Widget de clima -->
    <section id="weather" class="glass weather">
        <div class="now">
            <div id="w-icon" class="w-icon"></div>
            <div>
                <div class="w-temp"><span id="w-temp">--</span>°</div>
                <div id="w-desc" class="w-desc">Carregando clima…</div>
            </div>
        </div>
        <div class="w-info">
            <div id="w-place" class="w-place"></div>
            <div id="w-extra" class="w-extra"></div>
        </div>
        <div id="w-hours" class="w-hours"></div>
    </section>
    </div>

    <!-- Faixa de apps -->
    <main class="glass dock">
        <div id="row" class="row"></div>
        <div id="label" class="label"></div>
    </main>

    <!-- Todos os apps -->
    <section id="all" class="overlay hidden">
        <h2>Todos os apps</h2>
        <div id="grid" class="grid"></div>
    </section>

    <!-- Personalizar -->
    <section id="panel" class="panel hidden">
        <div class="panel-box">
            <h2>Personalizar</h2>
            <div class="panel-section">
                <h3>Tema</h3>
                <div id="themes" class="chips"></div>
            </div>
            <div class="panel-section">
                <h3>Ações</h3>
                <div id="actions" class="chips"></div>
            </div>
            <div class="panel-section grow">
                <h3>Apps na faixa <small>(OK adiciona / remove)</small></h3>
                <div id="apps" class="app-list"></div>
            </div>
        </div>
    </section>

    <div id="toast" class="toast"></div>

    <script src="js/platform.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
